name: 🏗️ Build
on:
    pull_request:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Build
              uses: jcdcdev/jcdcdev.Umbraco.GitHub.Build@v0
              with:
                  project-name: jcdcdev.Umbraco.CloudflareMediaCache
                  project-path: src/jcdcdev.Umbraco.CloudflareMediaCache/jcdcdev.Umbraco.CloudflareMediaCache.csproj
                  umbraco-version: 15
                  dotnet-version: "9"
